name: fuentes
on:
  push:
    branches: [voz-video]
    paths: ['.github/workflows/fuentes.yml']
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fuentes && cd fuentes
          B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o CormorantGaramond.ttf "$B/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf"
          curl -fsSL -o CormorantGaramond-Italic.ttf "$B/cormorantgaramond/CormorantGaramond-Italic%5Bwght%5D.ttf"
          curl -fsSL -o Jost.ttf "$B/jost/Jost%5Bwght%5D.ttf"
          ls -la
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes && git commit -m "Fuentes del logo" && git push
