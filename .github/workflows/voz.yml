name: voz
on:
  push:
    branches: [voz-video]
    paths: ['voz/lines.txt','voz/tts.py']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts && python voz/tts.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voz/out && git commit -m "Audio generado" && git push
